<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#08202C">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Sistema personal</title>
<style>
/* Sin webfont a propósito: este archivo se abre offline desde el teléfono.
   Una sola familia del sistema — el registro product no necesita display + body. */
:root{
  color-scheme:dark;
  --font:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;

  /* neutros — rampa teal, contraste verificado sobre --surface */
  --bg:        oklch(0.185 0.026 232);
  --bg-2:      oklch(0.215 0.028 232);
  --surface:   oklch(0.248 0.030 232);
  --surface-2: oklch(0.300 0.032 232);
  --surface-3: oklch(0.350 0.034 232);
  --line:      oklch(0.345 0.028 232);
  --line-soft: oklch(0.285 0.024 232);
  --ink:       oklch(0.965 0.010 232);   /* 10.3:1 sobre surface */
  --ink-2:     oklch(0.800 0.022 232);   /*  6.5:1 */
  --muted:     oklch(0.700 0.028 232);   /*  4.9:1 — piso AA */

  /* disciplinas: identidad existente, se conserva */
  --swim:#3DBEEA; --bike:#F5B93E; --run:#FF7A6B; --gym:#A98BF0;
  --eng:#5EEAD4;  --focus:#FCA5A5; --rest:#6B8C9B;
  --good:#4ADE80; --warn:#F5B93E;  --bad:#FF7A6B;

  /* escala fija ratio 1.2 — nada fluido en UI de producto */
  --t-xs:.75rem; --t-sm:.8125rem; --t-md:.875rem; --t-lg:1rem; --t-xl:1.1875rem;

  --r-sm:8px; --r-md:12px; --r-lg:16px;
  --ease:cubic-bezier(.22,1,.36,1);
  --ms:180ms;
  --z-bar:15; --z-tabs:20;
}
*,*::before,*::after{box-sizing:border-box}
*{-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--font);font-size:var(--t-md);line-height:1.5;
     background:var(--bg);color:var(--ink);font-variant-numeric:tabular-nums;
     -webkit-font-smoothing:antialiased;
     padding:0 0 calc(70px + env(safe-area-inset-bottom))}
input,select,button,textarea{font-family:inherit;font-variant-numeric:inherit}
/* 16px evita el zoom automático de iOS al enfocar un campo */
input,select{font-size:16px}
.wrap{max-width:540px;margin:0 auto}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.warnbar{display:none;padding:11px 16px;font-size:var(--t-xs);line-height:1.45;
     color:var(--warn);background:color-mix(in oklab,var(--warn) 16%,var(--bg));
     border-bottom:1px solid color-mix(in oklab,var(--warn) 32%,transparent)}

.bar{position:sticky;top:0;z-index:var(--z-bar);display:flex;align-items:stretch;
     background:var(--bg-2);border-bottom:1px solid var(--line-soft);
     padding-top:env(safe-area-inset-top)}
/* El dorsal es el único momento "display" del sistema. Todo lo demás es UI. */
.bib{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
     min-width:78px;padding:10px 14px;background:var(--ink);color:var(--bg)}
.bib-l{font-size:10px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;
     color:oklch(0.42 0.03 232)}
.bib-n{font-size:34px;font-weight:800;line-height:.92;letter-spacing:-.035em}
.bar-info{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;
     gap:2px;padding:10px 14px}
.bar-info h1{margin:0;font-size:var(--t-lg);font-weight:600;letter-spacing:-.012em;
     white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-info p{margin:0;font-size:var(--t-xs);color:var(--muted);line-height:1.35}
.bar-nav{display:flex;align-items:center;gap:6px;padding:0 12px}
.bar-nav button{display:grid;place-items:center;width:44px;height:44px;border-radius:10px;
     background:var(--surface-2);border:1px solid var(--line);color:var(--ink);
     font-size:20px;line-height:1;cursor:pointer;
     transition:background var(--ms) var(--ease),transform 120ms var(--ease)}
.bar-nav button:hover{background:var(--surface-3)}
.bar-nav button:active{transform:scale(.93)}

.sec{padding:28px 16px 0}
/* Encabezado real, no eyebrow: sin mayúsculas ni tracking.
   Se separa del título de tarjeta por peso (700 vs 600), no por tamaño. */
.sechead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:0 0 12px}
.sechead h2{margin:0;font-size:var(--t-lg);font-weight:700;letter-spacing:-.015em}
.sechead .count{font-size:var(--t-xs);color:var(--muted);white-space:nowrap}

/* El color de disciplina lo lleva el control, no un borde lateral. */
.card{--c:var(--rest);background:var(--surface);border:1px solid var(--line-soft);
      border-radius:var(--r-md);margin-bottom:10px;overflow:hidden;
      transition:background var(--ms) var(--ease),border-color var(--ms) var(--ease)}
.card.swim{--c:var(--swim)} .card.bike{--c:var(--bike)}
.card.run{--c:var(--run)}   .card.gym{--c:var(--gym)}
.card.eng{--c:var(--eng)}   .card.focus{--c:var(--focus)}
.card.done{background:var(--bg-2)}
.head{display:flex;align-items:center;gap:12px;padding:14px}
.tick{position:relative;flex:0 0 auto;display:grid;place-items:center;
      width:28px;height:28px;padding:0;border-radius:50%;cursor:pointer;
      background:transparent;border:2px solid color-mix(in oklab,var(--c) 60%,transparent);
      color:var(--bg);font-size:15px;font-weight:800;line-height:1;
      transition:background var(--ms) var(--ease),border-color var(--ms) var(--ease),
                 transform 120ms var(--ease)}
.tick::after{content:'';position:absolute;inset:-9px} /* área táctil 46px, no el círculo visible */
.tick:hover{border-color:var(--c)}
.tick[aria-pressed="true"]{background:var(--c);border-color:var(--c)}
.tick:active{transform:scale(.88)}
.ttl{flex:1;min-width:0}
.ttl strong{display:block;font-size:var(--t-lg);font-weight:600;letter-spacing:-.012em}
.ttl span{display:block;margin-top:2px;font-size:var(--t-xs);color:var(--muted);line-height:1.4}
.dur{flex:0 0 auto;align-self:flex-start;white-space:nowrap;font-size:var(--t-xs);
     color:var(--ink-2);background:var(--surface-2);border-radius:999px;padding:4px 9px;
     transition:background var(--ms) var(--ease),color var(--ms) var(--ease)}

/* Estado "hecho", igual en toda la app: tachado + apagado, nunca por debajo de AA.
   Se apaga con color, no con opacity — opacity sobre texto --muted cae a 3.4:1. */
.card.done .ttl strong{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1px}
.card.done .ttl span{color:var(--rest)}
.card.done .dur{background:transparent;color:var(--muted);box-shadow:inset 0 0 0 1px var(--line-soft)}
.subtask[aria-pressed="true"] .lbl b{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1px}
.subtask[aria-pressed="true"] .lbl em{color:var(--rest)}
.subtask[aria-pressed="true"] .min{color:var(--rest)}
/* Día que no es hoy: consulta, no captura. Sin casilla ni cursor de acción. */
.card.eng.readonly .subtask{cursor:default}
.card.eng.readonly .box{border-style:dashed;border-color:var(--line)}
.pill[aria-pressed="true"] .txt{text-decoration:line-through;text-decoration-thickness:1px;
     text-decoration-color:color-mix(in oklab,var(--ink) 45%,transparent)}

.body{border-top:1px solid var(--line-soft);padding:4px 14px 12px}
.ex{display:grid;grid-template-columns:1fr 62px 56px 58px;gap:8px;align-items:center;
    padding:9px 0;border-bottom:1px solid var(--line-soft)}
.ex:last-child{border-bottom:none}
.ex.hdr{padding:8px 0 6px}
.ex-n{min-width:0;font-size:var(--t-sm);line-height:1.3}
.ex-n em{display:block;margin-top:1px;font-style:normal;font-size:var(--t-xs);color:var(--muted)}
.ex input{width:100%;text-align:center;padding:10px 4px;border-radius:var(--r-sm);
    background:var(--bg-2);border:1px solid var(--line);color:var(--ink);
    transition:background var(--ms) var(--ease),border-color var(--ms) var(--ease)}
.ex input:focus{background:var(--surface-2)}
.prev{font-size:var(--t-xs);color:var(--muted);text-align:right;line-height:1.25}
.prev.beat{color:var(--good);font-weight:600}
.hd{font-size:var(--t-xs);color:var(--muted);text-align:center}

.subtask{display:flex;align-items:center;gap:12px;min-height:46px;padding:10px 0;
     border-bottom:1px solid var(--line-soft);cursor:pointer}
.subtask:last-child{border-bottom:none}
.subtask .box{flex:0 0 auto;display:grid;place-items:center;width:20px;height:20px;
     border-radius:6px;color:var(--bg);font-size:12px;font-weight:800;line-height:1;
     border:2px solid color-mix(in oklab,var(--eng) 55%,transparent);
     transition:background var(--ms) var(--ease),border-color var(--ms) var(--ease)}
.subtask[aria-pressed="true"] .box{background:var(--eng);border-color:var(--eng)}
.subtask .lbl{flex:1;min-width:0;font-size:var(--t-sm)}
.subtask .lbl b{display:block;font-weight:inherit}
.subtask .lbl em{display:block;margin-top:1px;font-style:normal;font-size:var(--t-xs);color:var(--muted)}
.subtask .min{flex:0 0 auto;font-size:var(--t-xs);color:var(--muted)}

.slot{padding:5px 0}
.slot input{width:100%;padding:11px 12px;border-radius:var(--r-sm);
     background:var(--bg-2);border:1px solid var(--line);color:var(--ink);
     transition:background var(--ms) var(--ease),border-color var(--ms) var(--ease)}
.slot input:focus{background:var(--surface-2)}
.slot input::placeholder{color:var(--muted)}

.note{margin:12px 0 0;font-size:var(--t-xs);color:var(--muted);line-height:1.55}
.note b{color:var(--ink-2);font-weight:600}

.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 0 4px}
.chip{min-height:44px;padding:0 14px;border-radius:10px;cursor:pointer;font-size:var(--t-sm);
     background:var(--bg-2);border:1px solid var(--line);color:var(--ink-2);
     transition:background var(--ms) var(--ease),border-color var(--ms) var(--ease),color var(--ms) var(--ease)}
.chip:hover{color:var(--ink)}
.chip.clean[aria-pressed="true"]{color:var(--ink);
     background:color-mix(in oklab,var(--good) 20%,var(--surface));
     border-color:color-mix(in oklab,var(--good) 55%,transparent)}
.chip.bad[aria-pressed="true"]{color:var(--ink);
     background:color-mix(in oklab,var(--bad) 20%,var(--surface));
     border-color:color-mix(in oklab,var(--bad) 55%,transparent)}
.streak{margin-left:auto;text-align:right;font-size:var(--t-xs);color:var(--muted)}
.streak.go{color:var(--good)}

.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 14px;
     border-radius:12px;cursor:pointer;font-size:var(--t-sm);
     background:var(--surface);border:1px solid var(--line-soft);color:var(--ink-2);
     transition:background var(--ms) var(--ease),border-color var(--ms) var(--ease),color var(--ms) var(--ease)}
.pill:hover{border-color:var(--line);color:var(--ink)}
.pill .dot{flex:0 0 auto;width:8px;height:8px;border-radius:50%;background:var(--line);
     transition:background var(--ms) var(--ease),box-shadow var(--ms) var(--ease)}
.pill[aria-pressed="true"]{color:var(--ink);
     background:color-mix(in oklab,var(--good) 16%,var(--surface));
     border-color:color-mix(in oklab,var(--good) 45%,transparent)}
.pill[aria-pressed="true"] .dot{background:var(--good);
     box-shadow:0 0 0 3px color-mix(in oklab,var(--good) 22%,transparent)}

.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;
     min-height:66px;padding:10px 2px;border-radius:12px;cursor:pointer;
     background:var(--surface);border:1px solid var(--line-soft);
     transition:background var(--ms) var(--ease),border-color var(--ms) var(--ease)}
.day:hover{background:var(--surface-2)}
.day.today{border-color:var(--ink);background:var(--surface-2)}
.day-l{font-size:var(--t-sm);font-weight:600;color:var(--muted)}
.day.today .day-l{color:var(--ink)}
.pips{display:flex;flex-wrap:wrap;gap:3px;justify-content:center;min-height:8px}
.pip{width:8px;height:8px;border-radius:50%}
.pip.swim{background:var(--swim)} .pip.bike{background:var(--bike)} .pip.run{background:var(--run)}
.pip.gym{background:var(--gym)} .pip.eng{background:var(--eng)} .pip.rest{background:var(--rest)}
.pip.off{opacity:.3}

.wrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.wrow input{width:110px;text-align:center;padding:11px 10px;border-radius:var(--r-sm);
     background:var(--bg-2);border:1px solid var(--line);color:var(--ink)}
.wrow span{flex:1;min-width:170px;font-size:var(--t-xs);color:var(--muted);line-height:1.45}
.fb.ok{color:var(--good)} .fb.warn{color:var(--warn)}

/* Notas de la rutina */
#noteIn{display:block;width:100%;min-height:80px;padding:12px 14px;border-radius:var(--r-sm);
  background:var(--bg-2);border:1px solid var(--line);color:var(--ink);
  font-family:var(--font);font-size:var(--t-sm);line-height:1.5;resize:vertical}
#noteIn::placeholder{color:var(--muted)}
#noteIn:focus-visible{outline:2px solid var(--swim);outline-offset:2px}
#noteAdd{min-height:44px;margin-top:10px;padding:0 16px;border-radius:10px;cursor:pointer;
  font-size:var(--t-sm);background:var(--surface-2);border:1px solid var(--line);color:var(--ink);
  transition:background var(--ms) var(--ease)}
#noteAdd:hover{background:var(--surface-3)}
#noteList{margin-top:8px}
#noteList .empty{margin:10px 0 0;font-size:var(--t-xs);color:var(--muted);line-height:1.5;max-width:60ch}
.note{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;
  padding:13px 0;border-bottom:1px solid var(--line-soft)}
.note:last-child{border-bottom:none}
.note b{display:block;font-size:var(--t-xs);font-weight:600;color:var(--muted)}
/* pre-wrap: la nota se escribe en varios renglones y así se lee igual que se escribió */
.note p{margin:4px 0 0;font-size:var(--t-sm);line-height:1.5;white-space:pre-wrap;
  overflow-wrap:anywhere}
.note button{flex:none;width:34px;height:34px;border-radius:8px;cursor:pointer;line-height:1;
  background:transparent;border:1px solid var(--line);color:var(--muted);font-size:17px;
  transition:color var(--ms) var(--ease),border-color var(--ms) var(--ease)}
.note button:hover{color:var(--bad);border-color:var(--bad)}

.grp{margin:18px 0 8px;font-size:var(--t-xs);font-weight:600;letter-spacing:.08em;
  text-transform:uppercase;color:var(--muted)}
.grp:first-of-type{margin-top:4px}
#planFind{width:100%;margin-bottom:12px;padding:12px 14px;border-radius:var(--r-sm);
  border:1px solid var(--line-soft);background:var(--surface);color:var(--ink);
  font-family:var(--font);font-size:var(--t-sm)}
#planFind:focus-visible{outline:2px solid var(--swim);outline-offset:2px}
#planNone{margin:14px 2px;font-size:var(--t-sm);color:var(--muted)}
.info{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r-md);margin-bottom:8px}
details.info>summary{display:flex;align-items:center;gap:12px;min-height:54px;padding:15px 16px;
  list-style:none;cursor:pointer;font-size:var(--t-md);font-weight:600;letter-spacing:-.012em}
details.info>summary::-webkit-details-marker{display:none}
details.info>summary::after{content:'';flex:0 0 auto;margin-left:auto;width:8px;height:8px;
  border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);
  transform:rotate(45deg) translate(-2px,-2px);
  transition:transform var(--ms) var(--ease),border-color var(--ms) var(--ease)}
details.info[open]>summary::after{transform:rotate(-135deg)}
details.info>summary:hover::after{border-color:var(--ink)}
details.info .inner{padding:14px 16px 18px;border-top:1px solid var(--line-soft)}
details.info .inner p{margin:0 0 10px;max-width:68ch;font-size:var(--t-sm);color:var(--ink-2);
  line-height:1.65;text-wrap:pretty}
details.info .inner ul{margin:0 0 10px;padding-left:18px;max-width:68ch}
details.info .inner li{margin-bottom:6px;font-size:var(--t-sm);color:var(--ink-2);line-height:1.65}
details.info .inner b{color:var(--ink);font-weight:600}
details.info .inner h4{margin:18px 0 8px;font-size:var(--t-md);color:var(--ink);font-weight:600}
details.info .inner h4:first-child{margin-top:0}
details.info .inner table{width:100%;border-collapse:collapse}
details.info .inner td{padding:9px 0;border-bottom:1px solid var(--line-soft);vertical-align:top;
  font-size:var(--t-sm);color:var(--ink-2);line-height:1.6}
details.info .inner tr:last-child td{border-bottom:none}
details.info .inner td:first-child{width:34%;padding-right:14px;color:var(--ink);font-weight:500}
.prompt{padding:12px 13px;border-radius:var(--r-sm);background:var(--surface-2);
  color:var(--ink)!important;line-height:1.6}

.copybar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.copybar button{min-height:44px;padding:0 14px;border-radius:10px;cursor:pointer;
  font-size:var(--t-sm);background:var(--surface-2);border:1px solid var(--line);color:var(--ink);
  transition:background var(--ms) var(--ease)}
.copybar button:hover{background:var(--surface-3)}
.copybar span{font-size:var(--t-xs);color:var(--muted)}

/* Resumen fijo: los cuatro números que se revisan cada 4 semanas, sin barrer. */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:14px}
.stat{padding:12px 14px;border-radius:var(--r-md);
      background:var(--surface);border:1px solid var(--line-soft)}
.stat b{display:block;font-size:1.375rem;font-weight:700;letter-spacing:-.025em;line-height:1.1}
.stat span{display:block;margin-top:3px;font-size:var(--t-xs);color:var(--muted);line-height:1.3}
.stat.ok b{color:var(--good)}
.stat.warn b{color:var(--warn)}

/* Una gráfica a la vez en vez de seis apiladas. */
.seg{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;
     margin:0 -16px 14px;padding:0 16px 2px}
.seg::-webkit-scrollbar{display:none}
.segbtn{flex:0 0 auto;min-height:44px;padding:0 14px;border-radius:10px;cursor:pointer;
     white-space:nowrap;font-size:var(--t-sm);
     background:var(--surface);border:1px solid var(--line-soft);color:var(--ink-2);
     transition:background var(--ms) var(--ease),color var(--ms) var(--ease),border-color var(--ms) var(--ease)}
.segbtn:hover{color:var(--ink);border-color:var(--line)}
.segbtn[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg);font-weight:600}

.chart{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r-md);
       padding:16px;margin-bottom:10px}
.chart h3{margin:0 0 4px;font-size:var(--t-md);font-weight:600;letter-spacing:-.012em}
.chart .cap{margin:0 0 14px;max-width:60ch;font-size:var(--t-xs);color:var(--muted);line-height:1.5}
.chart .cap b{color:var(--ink);font-weight:600}
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.chart svg text{fill:var(--muted);font-size:10px;font-family:var(--font)}
.chart svg .grid{stroke:var(--line-soft)}
.chart select{width:100%;margin-bottom:14px;padding:10px;border-radius:var(--r-sm);
  background:var(--bg-2);border:1px solid var(--line);color:var(--ink)}
.dots{display:flex;flex-wrap:wrap;gap:5px;padding-top:3px}
.dots i{display:block;width:14px;height:14px;border-radius:4px}
.dots i.ok{background:var(--good)} .dots i.no{background:var(--bad)}

.tabs{position:fixed;bottom:0;left:0;right:0;z-index:var(--z-tabs);display:flex;
      justify-content:center;background:var(--bg-2);border-top:1px solid var(--line-soft);
      padding-bottom:env(safe-area-inset-bottom)}
.tabs button{flex:1;max-width:135px;min-height:56px;margin-top:-1px;cursor:pointer;
      background:none;border:none;border-top:2px solid transparent;
      color:var(--muted);font-size:var(--t-xs);font-weight:600;
      transition:color var(--ms) var(--ease),border-color var(--ms) var(--ease)}
.tabs button:hover{color:var(--ink-2)}
.tabs button[aria-selected="true"]{color:var(--ink);border-top-color:var(--ink)}

/* Semana tiene poco contenido: los controles de respaldo se anclan abajo
   en vez de quedar flotando bajo el peso. */
#tab-semana{display:flex;flex-direction:column;min-height:64svh}
#tab-semana .foot{margin-top:auto}
.foot{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;
      padding:26px 16px 8px;font-size:var(--t-xs);color:var(--muted)}
.foot button{min-height:44px;padding:0 12px;border-radius:9px;cursor:pointer;font-size:var(--t-xs);
      background:var(--surface);border:1px solid var(--line-soft);color:var(--ink-2);
      transition:background var(--ms) var(--ease),color var(--ms) var(--ease),border-color var(--ms) var(--ease)}
.foot button:hover{background:var(--surface-2);color:var(--ink)}
.foot button.danger{color:var(--bad);border-color:color-mix(in oklab,var(--bad) 45%,transparent)}
.foot button.armed{color:var(--ink);background:color-mix(in oklab,var(--bad) 26%,var(--surface));
      border-color:var(--bad)}

/* Dropdown de acciones: oculto por defecto, se abre hacia arriba porque
   los tabs quedan fijos abajo (.tabs) y taparían un panel que abriera hacia abajo. */
.menu{position:relative}
.menu>summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:center;
      width:44px;height:44px;border-radius:9px;font-size:20px;line-height:1;
      background:var(--surface);border:1px solid var(--line-soft);color:var(--ink-2);
      transition:background var(--ms) var(--ease),color var(--ms) var(--ease)}
.menu>summary::-webkit-details-marker{display:none}
.menu>summary:hover,.menu[open]>summary{background:var(--surface-2);color:var(--ink)}
.menu-body{position:absolute;right:0;bottom:calc(100% + 8px);z-index:21;min-width:190px;
      display:flex;flex-direction:column;gap:6px;padding:8px;
      background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r-md);
      box-shadow:0 8px 24px rgba(0,0,0,.35)}
.menu-body button{width:100%;text-align:left}

.lock{position:fixed;inset:0;z-index:99;display:flex;align-items:center;justify-content:center;
  padding:24px;background:var(--bg)}
.lock-box{width:100%;max-width:340px;display:flex;flex-direction:column;gap:12px}
.lock-box h1{margin:0;font-size:var(--t-lg);font-weight:600;letter-spacing:-.02em}
.lock-box p{margin:0;font-size:var(--t-sm);color:var(--ink-2);line-height:1.55}
.lock-box input[type=password]{width:100%;min-height:46px;padding:0 13px;border-radius:10px;
  background:var(--bg-2);border:1px solid var(--line);color:var(--ink)}
.lock-rem{display:flex;align-items:center;gap:8px;font-size:var(--t-xs);color:var(--muted)}
.lock-box button{min-height:46px;border-radius:10px;cursor:pointer;font-size:var(--t-sm);font-weight:600;
  background:var(--swim);border:none;color:#04222e}
.lock-box button:disabled{opacity:.6;cursor:default}
.lock-err{color:var(--bad)!important;min-height:1.2em}

.hide{display:none!important}
:focus-visible{outline:2px solid var(--swim);outline-offset:2px;border-radius:4px}

@media (max-width:380px){
  .sec{padding:18px 12px 0}
  .foot{padding:22px 12px 8px}
  .bib{min-width:66px;padding:9px 10px}
  .bib-n{font-size:28px}
  .ex{grid-template-columns:1fr 54px 50px 50px;gap:6px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition-duration:1ms!important;animation-duration:1ms!important}
}
</style>
</head>
<body>
<div class="wrap">
<div class="warnbar" id="warnbar" role="status"></div>

<header class="bar">
  <div class="bib"><span class="bib-l">Semana</span><span class="bib-n" id="bibNum">1</span></div>
  <div class="bar-info"><h1 id="blockName">—</h1><p id="blockDesc">—</p></div>
  <div class="bar-nav">
    <button type="button" id="prevW" aria-label="Semana anterior">&minus;</button>
    <button type="button" id="nextW" aria-label="Semana siguiente">+</button>
  </div>
</header>

<main>
<div id="tab-hoy" role="tabpanel" aria-labelledby="tb-hoy">
  <section class="sec">
    <div class="sechead"><h2 id="todayLabel">Hoy</h2><span class="count" id="sesCount"></span></div>
    <div id="sessions"></div>
  </section>
  <section class="sec">
    <div class="sechead"><h2>Inglés</h2><span class="count" id="engCount"></span></div>
    <div id="english"></div>
  </section>
  <section class="sec">
    <div class="sechead"><h2>Enfoque</h2></div>
    <div id="focus"></div>
  </section>
  <section class="sec">
    <div class="sechead"><h2>Hábitos</h2><span class="count" id="habCount"></span></div>
    <div class="pills" id="habits"></div>
  </section>
</div>

<div id="tab-semana" class="hide" role="tabpanel" aria-labelledby="tb-semana">
  <section class="sec">
    <div class="sechead"><h2>La semana</h2></div>
    <div class="week" id="week"></div>
  </section>
  <section class="sec">
    <div class="sechead"><h2>Peso de control</h2></div>
    <div class="wrow">
      <input id="bw" inputmode="decimal" placeholder="kg" aria-label="Peso de la semana">
      <span id="bwFeedback" class="fb">Pésate un día fijo, en ayunas.</span>
    </div>
  </section>
  <section class="sec">
    <div class="sechead"><h2>Notas de la rutina</h2><span class="count" id="noteCount"></span></div>
    <textarea id="noteIn" rows="3" aria-label="Nueva nota"
      placeholder="Qué te gustó, qué cambiar, qué no hay en el gimnasio…"></textarea>
    <button type="button" id="noteAdd">Guardar nota</button>
    <div id="noteList"></div>
  </section>
  <div class="foot">
    <span id="status" role="status">—</span>
    <details class="menu" id="menu">
      <summary aria-label="Más opciones">⋯</summary>
      <div class="menu-body">
        <button type="button" id="exportBtn">Descargar copia</button>
        <button type="button" id="importBtn">Restaurar</button>
        <button type="button" id="installBtn">Instalar app</button>
        <button type="button" id="resetBtn" class="danger">Borrar todo</button>
      </div>
    </details>
  </div>
</div>

<div id="tab-datos" class="hide" role="tabpanel" aria-labelledby="tb-datos"><div class="sec" id="chartsBody"></div></div>
<div id="tab-plan" class="hide" role="tabpanel" aria-labelledby="tb-plan"><div class="sec" id="planBody"></div></div>
</main>

<input type="file" id="fileIn" accept="application/json" style="display:none">
</div>

<div class="lock" id="lock">
  <div class="lock-box">
    <h1>Sistema personal</h1>
    <p>El plan está cifrado. Escribe tu frase de acceso para abrirlo.</p>
    <input type="password" id="lockPass" autocomplete="current-password"
           placeholder="frase de acceso" aria-label="Frase de acceso">
    <label class="lock-rem"><input type="checkbox" id="lockRemember" checked> Recordar en este dispositivo</label>
    <button type="button" id="lockBtn">Abrir</button>
    <p class="lock-err" id="lockErr" role="alert"></p>
  </div>
</div>
<div class="tabs" role="tablist" aria-label="Secciones">
  <button type="button" role="tab" id="tb-hoy"    aria-controls="tab-hoy"    aria-selected="true"  data-tab="hoy">Hoy</button>
  <button type="button" role="tab" id="tb-semana" aria-controls="tab-semana" aria-selected="false" data-tab="semana">Semana</button>
  <button type="button" role="tab" id="tb-datos"  aria-controls="tab-datos"  aria-selected="false" data-tab="datos">Datos</button>
  <button type="button" role="tab" id="tb-plan"   aria-controls="tab-plan"   aria-selected="false" data-tab="plan">Plan</button>
</div>

const KEY_CACHE = 'sistema-key';
const ITER = 600000;

const b64d = s => Uint8Array.from(atob(s), c=>c.charCodeAt(0));
const b64e = b => btoa(String.fromCharCode(...new Uint8Array(b)));

async function deriveKey(pass, salt){
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass),
    'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2', salt, iterations:ITER, hash:'SHA-256'},
    base, {name:'AES-GCM', length:256}, true, ['decrypt']);
}

/* AES-GCM autentica: si la frase está mal, decrypt lanza en vez de devolver basura. */
async function decryptPlan(key){
  const blob = b64d(PLAN_ENC);
  const plain = await crypto.subtle.decrypt(
    {name:'AES-GCM', iv: blob.slice(16,28)}, key, blob.slice(28));
  return JSON.parse(new TextDecoder().decode(plain));
}

function applyPlan(p){
  ({GYM,RUN,SWIM,BLOCKS,ENG_TASKS,ENG_BLOCKS,ENG_PHASES,HABITS,SECTIONS} = p);
}

/* ============================================================
   2 · ESTADO
   ============================================================ */

/* Zona horaria fija UTC-5, sin horario de verano. Se ancla explícito para no
   depender de la zona horaria del dispositivo. */
const BOGOTA_MS = 5*60*60*1000;
const bogota  = (t=Date.now()) => new Date(t - BOGOTA_MS);
const dayISO  = (t=Date.now()) => bogota(t).toISOString().slice(0,10);

const DEFAULTS = () => ({ week:1, log:{}, weights:{}, habits:{}, eng:{},
                          focus:{}, notes:[], chartLift:null, chartView:null, tab:'hoy' });
let S = DEFAULTS();
let viewDay = bogota().getUTCDay();
let canSave = true;
let chartsDirty = true;   // Store.save() es el único punto de mutación

/* Frontera de confianza: el JSON importado viene de un archivo del usuario. */
function sanitize(raw){
  if(!raw || typeof raw!=='object' || Array.isArray(raw)) throw new Error('formato');
  const s = Object.assign(DEFAULTS(), raw);
  s.week = Math.min(999, Math.max(1, Math.floor(+s.week) || 1));
  ['log','weights','habits','eng','focus'].forEach(k=>{
    if(!s[k] || typeof s[k]!=='object' || Array.isArray(s[k])) s[k]={};
  });
  /* Las notas son texto libre del usuario y se pintan con innerHTML: se acotan
     aquí y se escapan al render. Se descarta lo que no tenga forma de nota. */
  s.notes = (Array.isArray(s.notes) ? s.notes : [])
    .filter(n => n && typeof n === 'object' && typeof n.t === 'string' && n.t.trim())
    .slice(0, 500)
    .map(n => ({ d: /^\d{4}-\d{2}-\d{2}$/.test(n.d) ? n.d : dayISO(),
                 w: Math.min(999, Math.max(1, Math.floor(+n.w) || 1)),
                 t: n.t.trim().slice(0, 2000) }));
  if(['hoy','semana','datos','plan'].indexOf(s.tab)<0) s.tab='hoy';
  return s;
}

const Store = {
  save(){
    chartsDirty = true;
    if(!canSave) return;
    try{
      localStorage.setItem(KEY, JSON.stringify(S));
      $('status').textContent = 'Guardado ' + new Date().toLocaleTimeString('es-CO',{hour:'2-digit',minute:'2-digit',timeZone:'America/Bogota'});
    }catch(e){ canSave=false; Store.warn(); }
  },
  warn(){
    $('warnbar').style.display='block';
    $('warnbar').textContent='Este visor no permite guardar. Descarga el archivo y ábrelo desde tu navegador.';
    $('status').textContent='Solo lectura';
  },
  load(){
    try{
      const raw = localStorage.getItem(KEY);
      if(raw) S = sanitize(JSON.parse(raw));
      localStorage.setItem(KEY+'-t','1'); localStorage.removeItem(KEY+'-t');
      $('status').textContent = raw ? 'Cargado' : 'Nuevo';
    }catch(e){ canSave=false; Store.warn(); }
  },
  // registro de entrenamiento por semana + día de semana
  train(){
    const k='w'+S.week+'d'+viewDay;
    const l = S.log[k] = S.log[k] || {};
    l.done=l.done||{}; l.lifts=l.lifts||{}; l.blister=l.blister||{}; l.swim=l.swim||{};
    return l;
  },
  // registros por fecha real
  habits(){ return S.habits[dayISO()] = S.habits[dayISO()] || {}; },
  eng(){    return S.eng[dayISO()]    = S.eng[dayISO()]    || {}; },
  focus(){  return S.focus[dayISO()]  = S.focus[dayISO()]  || {p1:'',p2:'',deep:false}; }
};

/* ============================================================
   3 · LÓGICA derivada
   ============================================================ */

function plan(dow, wk){
  const r = RUN[wk] || RUN[24];
  const sw = SWIM[Math.min(6, Math.ceil(wk/4))];
  if(dow===1) return [{k:'gym',id:'gym-pull',...GYM.pull}];
  if(dow===2) return [
    {k:'swim',id:'swim-class',name:'Natación · clase',sub:sw.t,dur:'45 min',goal:sw.goal},
    {k:'run', id:'run-tue',   name:'Trote fácil',     sub:r[0],dur:'Z2'}];
  if(dow===3) return [{k:'gym',id:'gym-legs',...GYM.legs}];
  if(dow===4) return [
    {k:'swim',id:'swim-free1',name:'Natación libre',sub:'Repite los drills de la clase',dur:'45 min',goal:sw.goal},
    {k:'bike',id:'bike-thu',  name:'Bici Z2',       sub:'La estática del gimnasio sirve',dur:'45 min'}];
  if(dow===5) return [
    {k:'swim',id:'swim-free2',name:'Natación libre',sub:'Repite los drills de la clase',dur:'45 min',goal:sw.goal},
    {k:'gym', id:'gym-push',...GYM.push}];
  if(dow===6) return [{k:'rest',id:'rest',name:'Descanso',sub:'Sauna, turco, estiramiento largo',dur:'—'}];
  return [{k:'run',id:'run-sun',name:'Tirada larga',sub:r[1],dur:'Z2'}];
}

function lastLift(key){
  for(let w=S.week; w>=1; w--) for(const d of [5,3,1]){
    if(w===S.week && d===viewDay) continue;
    const l=S.log['w'+w+'d'+d];
    const v = l && l.lifts && l.lifts[key];
    if(v && v.kg) return v;
  }
  return null;
}

function blisterStreak(){
  const rows=[];
  Object.keys(S.log).forEach(k=>{
    const m=k.match(/^w(\d+)d(\d+)$/); if(!m) return;
    rows.push({r:+m[1]*10+(+m[2]===0?7:+m[2]), b:S.log[k].blister||{}});
  });
  rows.sort((a,b)=>a.r-b.r);
  let n=0;
  rows.forEach(o=>Object.values(o.b).forEach(v=>{ if(v==='no')n++; else if(v==='si')n=0; }));
  return n;
}

function daysBack(n){
  const out=[]; const DAY=86400000; const t=Date.now();
  for(let i=n-1;i>=0;i--) out.push(dayISO(t-i*DAY));
  return out;
}
function engMinutes(iso){
  const rec=S.eng[iso]||{};
  return Object.keys(rec).filter(k=>rec[k]).reduce((a,k)=>a+((ENG_TASKS[k]||{}).m||0),0);
}
function habitStreak(){
  let n=0; const DAY=86400000; const t=Date.now();
  for(let i=0;i<90;i++){
    const rec=S.habits[dayISO(t-i*DAY)];
    const full = rec && HABITS.every(h=>rec[h[0]]);
    if(full) n++; else if(i>0) break;
  }
  return n;
}

const View = {};

View.header = function(){
  const b = BLOCKS.find(x=>S.week<=x.max);
  $('bibNum').textContent   = S.week;
  $('blockName').textContent = b.n;
  $('blockDesc').textContent = b.d;
  $('todayLabel').textContent = (viewDay===bogota().getUTCDay()?'Hoy · ':'')+DAYS[viewDay];
};

View.sessions = function(){
  const log = Store.train(), wrap = $('sessions');
  const list = plan(viewDay,S.week);
  wrap.innerHTML='';
  const real = list.filter(s=>s.k!=='rest');
  $('sesCount').textContent = real.length
    ? real.filter(s=>log.done[s.id]).length+'/'+real.length+' hechas' : 'Descanso';
  list.forEach(s=>{
    const done=!!log.done[s.id];
    const c=document.createElement('div');
    c.className='card '+s.k+(done?' done':'');
    let h='<div class="head"><button type="button" class="tick" aria-pressed="'+done+'" aria-label="Marcar '+s.name+'">'
      +(done?'\u2713':'')+'</button><div class="ttl"><strong>'+s.name+'</strong><span>'+s.sub+'</span></div>'
      +'<div class="dur">'+s.dur+'</div></div>';

    if(s.ex){
      /* Las cargas se anotan en libras (los discos del gimnasio vienen en lb).
         La clave interna sigue llamándose "kg" para no romper los registros ya
         guardados en localStorage: es solo el nombre del campo, no la unidad. */
      h+='<div class="body"><div class="ex hdr"><span></span><span class="hd">lb</span><span class="hd">reps</span><span class="hd">antes</span></div>';
      s.ex.forEach((e,i)=>{
        const key=s.id+'-'+i, v=log.lifts[key]||{kg:'',reps:''}, p=lastLift(key);
        const beat=p&&v.kg&&+v.kg>+p.kg;
        h+='<div class="ex"><div class="ex-n">'+e[0]+'<em>'+e[1]+'</em></div>'
          +'<input data-l="'+key+'" data-f="kg" value="'+v.kg+'" inputmode="decimal" aria-label="Peso en libras">'
          +'<input data-l="'+key+'" data-f="reps" value="'+v.reps+'" inputmode="numeric" aria-label="Reps">'
          +'<div class="prev'+(beat?' beat':'')+'">'+(p?p.kg+'\u00d7'+p.reps+(beat?' \u2191':''):'\u2014')+'</div></div>';
      });
      h+='</div>';
    } else if(s.k==='run'){
      const bl=log.blister[s.id]||'', st=blisterStreak(), next=(RUN[S.week+1]||RUN[24])[1];
      h+='<div class="body"><div class="chips">'
        +'<button type="button" class="chip clean" data-b="'+s.id+'" data-v="no" aria-pressed="'+(bl==='no')+'">Sin ampolla</button>'
        +'<button type="button" class="chip bad" data-b="'+s.id+'" data-v="si" aria-pressed="'+(bl==='si')+'">Ampolla</button>'
        +'<span class="streak'+(st>=3?' go':'')+'">'
        +(st>=3?'3 limpias \u00b7 sube a '+next:'Racha '+st+'/3')+'</span></div></div>';
    } else if(s.k==='swim'){
      const sw=log.swim[s.id]||{cont:''};
      h+='<div class="body"><div class="ex" style="grid-template-columns:1fr 80px">'
        +'<div class="ex-n">Metros seguidos hoy<em>Meta del mes: '+s.goal+' m</em></div>'
        +'<input data-s="'+s.id+'" value="'+sw.cont+'" inputmode="numeric" placeholder="m" aria-label="Metros seguidos">'
        +'</div></div>';
    }
    c.innerHTML=h;
    c.querySelector('.tick').onclick=()=>{ log.done[s.id]=!log.done[s.id]; Store.save(); render(); };
    /* Actualiza la celda "antes" en sitio en vez de reconstruir el DOM:
       en móvil el rebuild mataba el input al saltar de kg a reps. */
    c.querySelectorAll('input[data-l]').forEach(i=>i.onchange=()=>{
      const k=i.dataset.l; log.lifts[k]=log.lifts[k]||{kg:'',reps:''};
      log.lifts[k][i.dataset.f]=i.value; Store.save();
      const p=lastLift(k), v=log.lifts[k], cell=i.closest('.ex').querySelector('.prev');
      const beat=p&&v.kg&&+v.kg>+p.kg;
      cell.className='prev'+(beat?' beat':'');
      cell.textContent=p ? p.kg+'×'+p.reps+(beat?' ↑':'') : '—';
    });
    c.querySelectorAll('button[data-b]').forEach(btn=>btn.onclick=()=>{
      const cur=log.blister[btn.dataset.b];
      log.blister[btn.dataset.b]=(cur===btn.dataset.v)?'':btn.dataset.v; Store.save(); render(); });
    c.querySelectorAll('input[data-s]').forEach(i=>i.onchange=()=>{
      log.swim[i.dataset.s]={cont:i.value}; Store.save(); });
    wrap.appendChild(c);
  });
};

  const mins  = tasks.reduce((a,t)=>a+ENG_TASKS[t].m,0);

  /* El inglés se registra por fecha real, no por día del plan: en otro día
     solo se puede consultar. Se marca como tal en vez de fingir que responde. */
  let h='<div class="card eng'+(isToday?'':' readonly')+'"><div class="head"><div class="ttl">'
    +'<strong>'+blk.lvl+' \u00b7 '+blk.n+'</strong><span>'+blk.topics+'</span></div>'
    +'<div class="dur">'+mins+' min</div></div><div class="body">';

    const on=!!rec[t], T=ENG_TASKS[t];
    const cuerpo = '<span class="lbl"><b>'+T.n+'</b><em>'+T.s+'</em></span>'
      +'<span class="min">'+T.m+"'"+'</span></div>';
    h+= isToday
      ? '<div class="subtask" data-e="'+t+'" aria-pressed="'+on+'" role="button" tabindex="0">'
        +'<span class="box">'+(on?'\u2713':'')+'</span>'+cuerpo
      : '<div class="subtask"><span class="box" aria-hidden="true"></span>'+cuerpo;

    +'<b>Entregable de la semana:</b> '+blk.deliver+'</p>';
  h+='</div></div>';
  $('english').innerHTML=h;
  $('engCount').textContent = isToday
    ? doneN+'/'+tasks.length+' hechas'

View.week = function(){
  const wk=$('week'); wk.innerHTML='';
  [1,2,3,4,5,6,0].forEach(d=>{
    const el=document.createElement('div');
    el.className='day'+(d===viewDay?' today':'');
    const dd=S.log['w'+S.week+'d'+d]||{};
    /* El pip de inglés se quitó: se registraba por fecha real, no por día del
       plan, así que nunca se encendía y enseñaba a ignorar los pips. */
    const pips = plan(d,S.week).map(s=>'<span class="pip '+s.k+((dd.done||{})[s.id]?'':' off')+'"></span>').join('');
    el.innerHTML='<div class="day-l">'+SHORT[d]+'</div><div class="pips">'+pips+'</div>';
    el.onclick=()=>{ viewDay=d; render(); show('hoy'); };
    wk.appendChild(el);
  });

  const bw=$('bw'); bw.value=S.weights[S.week]||'';
  bw.onchange=()=>{ S.weights[S.week]=bw.value; Store.save(); render(); };
  const cur=+S.weights[S.week], prev=+S.weights[S.week-1], fb=$('bwFeedback');
  if(cur&&prev){
    const d=+(cur-prev).toFixed(1);
    if(d<=-0.5){ fb.className='fb warn'; fb.textContent=d+' kg \u00b7 estás comiendo poco, sube la cena'; }
    else if(d>=0.6){ fb.className='fb'; fb.textContent='+'+d+' kg \u00b7 normal si venías en déficit'; }
    else { fb.className='fb ok'; fb.textContent=(d>=0?'+':'')+d+' kg \u00b7 estable'; }
  } else { fb.className='fb';
    fb.textContent = cur ? 'Anota otra semana para ver la tendencia.' : 'Pésate un día fijo, en ayunas.'; }
};

/* ---------- gráficas ---------- */
const Chart = {
  line(pts,color,opt){
    opt=opt||{};
    const W=320,H=118,PL=34,PR=10,PT=14,PB=22;
    const ys=pts.map(p=>p.y).concat(opt.goal?[opt.goal]:[]);
    let mn=Math.min(...ys), mx=Math.max(...ys);
    if(mx===mn){ mx=mn+1; mn=Math.max(0,mn-1); }
    const pd=(mx-mn)*0.15; mn-=pd; mx+=pd;
    const X=i=>pts.length===1?(PL+(W-PL-PR)/2):PL+i*(W-PL-PR)/(pts.length-1);
    const Y=v=>PT+(H-PT-PB)*(1-(v-mn)/(mx-mn));
    let s='<svg viewBox="0 0 '+W+' '+H+'" role="img">'
      +'<title>'+(opt.title||'Gráfica de evolución')+'</title>';
    [0,.5,1].forEach(f=>{ const y=PT+(H-PT-PB)*f;
      s+='<line class="grid" x1="'+PL+'" y1="'+y+'" x2="'+(W-PR)+'" y2="'+y+'"/>'; });
    s+='<text x="0" y="'+(PT+4)+'">'+mx.toFixed(opt.dec||0)+'</text>';
    s+='<text x="0" y="'+(H-PB+4)+'">'+mn.toFixed(opt.dec||0)+'</text>';
    if(opt.goal!==undefined && opt.goal>=mn && opt.goal<=mx)
      s+='<line x1="'+PL+'" y1="'+Y(opt.goal)+'" x2="'+(W-PR)+'" y2="'+Y(opt.goal)
        +'" stroke="'+color+'" stroke-width="1" stroke-dasharray="3 3" opacity=".55"/>';
    if(pts.length>1){
      const d=pts.map((p,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(p.y).toFixed(1)).join(' ');
      s+='<path d="'+d+'" fill="none" stroke="'+color+'" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
    }
    pts.forEach((p,i)=>{ s+='<circle cx="'+X(i).toFixed(1)+'" cy="'+Y(p.y).toFixed(1)+'" r="3" fill="'+color+'"/>'; });
    const step=Math.ceil(pts.length/6);
    pts.forEach((p,i)=>{ if(i%step===0||i===pts.length-1)
      s+='<text x="'+X(i).toFixed(1)+'" y="'+(H-5)+'" text-anchor="middle">'+p.x+'</text>'; });
    return s+'</svg>';
  },
  bars(pts,color,max,title){
    max=max||100;
    const W=320,H=108,PL=30,PR=8,PT=12,PB=22;
    const step=(W-PL-PR)/Math.max(pts.length,1);
    const bw=Math.min(26,step-4);
    let s='<svg viewBox="0 0 '+W+' '+H+'" role="img">'
      +'<title>'+(title||'Gráfica de barras')+'</title>';
    s+='<line class="grid" x1="'+PL+'" y1="'+(H-PB)+'" x2="'+(W-PR)+'" y2="'+(H-PB)+'"/>';
    s+='<text x="0" y="'+(PT+4)+'">'+max+'</text>';
    pts.forEach((p,i)=>{
      const x=PL+i*step+2, h=(H-PT-PB)*Math.min(p.y/max,1);
      s+='<rect x="'+x.toFixed(1)+'" y="'+(H-PB-h).toFixed(1)+'" width="'+bw.toFixed(1)
        +'" height="'+Math.max(h,1).toFixed(1)+'" rx="2" fill="'+color+'" opacity="'+(p.y>=max*0.8?1:.55)+'"/>';
      s+='<text x="'+(x+bw/2).toFixed(1)+'" y="'+(H-6)+'" text-anchor="middle">'+p.x+'</text>';
    });
    return s+'</svg>';
  }
};

const Series = {
  weight(){ return Object.keys(S.weights).filter(w=>+S.weights[w]>0)
    .map(w=>({x:'S'+w, n:+w, y:+S.weights[w]})).sort((a,b)=>a.n-b.n); },
  swim(){
    const by={};
    Object.keys(S.log).forEach(k=>{ const m=k.match(/^w(\d+)d/); if(!m) return;
      Object.values(S.log[k].swim||{}).forEach(v=>{ const c=+v.cont||0; if(c>(by[+m[1]]||0)) by[+m[1]]=c; }); });
    return Object.keys(by).map(w=>({x:'S'+w, n:+w, y:by[w]})).sort((a,b)=>a.n-b.n);
  },
  liftKeys(){
    const map={};
    [['gym-pull',GYM.pull],['gym-legs',GYM.legs],['gym-push',GYM.push]]
      .forEach(([id,g])=>g.ex.forEach((e,i)=>{ map[id+'-'+i]=e[0]; }));
    const out=[];
    Object.keys(map).forEach(k=>{
      let n=0; Object.keys(S.log).forEach(lk=>{ const v=(S.log[lk].lifts||{})[k]; if(v&&+v.kg>0) n++; });
      if(n>=2) out.push({key:k,name:map[k]});
    });
    return out;
  },
  lift(key){
    const by={};
    Object.keys(S.log).forEach(k=>{ const m=k.match(/^w(\d+)d/); if(!m) return;
      const v=(S.log[k].lifts||{})[key];
      if(v&&+v.kg>0 && +v.kg>(by[+m[1]]||0)) by[+m[1]]=+v.kg; });
    return Object.keys(by).map(w=>({x:'S'+w, n:+w, y:by[w]})).sort((a,b)=>a.n-b.n);
  },
  english(){
    return daysBack(21).map(iso=>({x:iso.slice(8), y:engMinutes(iso)}));
  },
  compliance(){
    const set=new Set();
    Object.keys(S.log).forEach(k=>{ const m=k.match(/^w(\d+)d/); if(m) set.add(+m[1]); });
    return [...set].sort((a,b)=>a-b).map(w=>{
      let tot=0, ok=0;
      [1,2,3,4,5,6,0].forEach(d=>{
        const ss=plan(d,w).filter(s=>s.k!=='rest');
        const done=(S.log['w'+w+'d'+d]||{}).done||{};
        tot+=ss.length; ss.forEach(s=>{ if(done[s.id]) ok++; });
      });
      return {x:'S'+w, y: tot?Math.round(ok/tot*100):0};
    });
  },
  blisters(){
    const rows=[];
    Object.keys(S.log).forEach(k=>{ const m=k.match(/^w(\d+)d(\d+)$/); if(!m) return;
      Object.values(S.log[k].blister||{}).forEach(v=>{ if(v) rows.push({r:+m[1]*10+(+m[2]===0?7:+m[2]),v}); }); });
    return rows.sort((a,b)=>a.r-b.r).map(o=>o.v);
  }
};

/* Datos era una tira de 6 gráficas apiladas: había que barrer toda la pantalla
   para llegar a la última. Ahora: resumen fijo arriba + una gráfica a la vez. */
View.charts = function(){
  const w=Series.weight(), sw=Series.swim(), cm=Series.compliance(), bd=Series.blisters();
  const en=Series.english(), lifts=Series.liftKeys();
  const goal=SWIM[Math.min(6,Math.ceil(S.week/4))].goal;

  const engDone = en.filter(p=>p.y>0).length;
  const swMax   = sw.length ? Math.max(...sw.map(p=>p.y)) : null;
  const cmAvg   = cm.length ? Math.round(cm.reduce((a,b)=>a+b.y,0)/cm.length) : null;
  const wDelta  = w.length>=2 ? +(w[w.length-1].y-w[0].y).toFixed(1) : null;

  /* Cada entrada: id, etiqueta corta para el selector, y su bloque. */

  V.push({id:'ingles', label:'Inglés', html:
    '<div class="chart"><h3>Inglés · últimos 21 días</h3><p class="cap">'
    + (engDone ? 'Minutos por día. <b>'+engDone+' de 21</b> días con trabajo de inglés.'

    + '</p>' + (engDone?Chart.bars(en,'#5EEAD4',60,'Minutos de inglés por día en los últimos 21 días'):'')

  V.push({id:'peso', label:'Peso', html:
    '<div class="chart"><h3>Peso corporal</h3><p class="cap">'
    + (w.length>=2
        ? (wDelta<=-0.7 ? 'Vas <b>'+wDelta+' kg</b> desde que empezaste. Estás comiendo menos de lo que gastas.'

         : 'Estable (<b>'+(wDelta>=0?'+':'')+wDelta+' kg</b>). Es lo que buscas mientras subes carga.')
          + '</p>' + Chart.line(w,'#3DBEEA',{dec:1,title:'Peso corporal por semana'})

    + '</div>'});

  V.push({id:'nado', label:'Nado', html:
    '<div class="chart"><h3>Nado seguido</h3><p class="cap">'
    + (sw.length
        ? 'Máximo: <b>'+swMax+' m</b> sin parar. Meta del mes: <b>'+goal+' m</b> (punteada).'
          + '</p>' + Chart.line(sw,'#3DBEEA',{goal,title:'Metros nadados sin parar por semana'})
        : 'Anota los metros seguidos después de nadar y aquí ves la curva.</p>')
    + '</div>'});

    liftHtml+='<select id="liftSel" aria-label="Elegir ejercicio">'

    const ls=Series.lift(sel);

    liftHtml+='<p class="cap">'+(d>0?'Has subido <b>+'+d+' lb</b> en este ejercicio.'

      : 'Mismo peso que al inicio. Toca subir carga o reps.')+'</p>'

    + (cm.length

  const cur = V.find(v=>v.id===S.chartView) ? S.chartView : V[0].id;
  const seg = '<div class="seg" role="tablist" aria-label="Elegir gráfica">'
    + V.map(v=>'<button type="button" class="segbtn" role="tab" data-c="'+v.id+'" '
        +'aria-selected="'+(v.id===cur)+'">'+v.label+'</button>').join('')
    + '</div>';

  $('chartsBody').innerHTML = head + seg + V.find(v=>v.id===cur).html;

  $('chartsBody').querySelectorAll('.segbtn').forEach(b=>b.onclick=()=>{
    S.chartView=b.dataset.c; Store.save(); View.charts(); chartsDirty=false;
    $('chartsBody').querySelector('.segbtn[aria-selected="true"]')
      .scrollIntoView({block:'nearest',inline:'nearest'});
  });
  const ls=$('liftSel');
  if(ls) ls.onchange=()=>{ S.chartLift=ls.value; Store.save(); View.charts(); chartsDirty=false; };
};

/* ---------- plan de referencia ---------- */
function planText(){
  let g=null;
  return 'SISTEMA PERSONAL \u2014 TRIATLÓN, INGLÉS Y ENFOQUE\n\n' + SECTIONS.map((s,i)=>
    (s.g && s.g!==g ? (g=s.g, '## '+s.g.toUpperCase()+'\n\n') : '')+
    (i+1)+'. '+s.t.toUpperCase()+'\n'+
    s.b.replace(/<\/(p|h4|ul|table|tr)>/g,'\n')
       .replace(/<li>/g,'- ').replace(/<\/li>/g,'\n')
       .replace(/<\/td><td>/g,': ').replace(/<[^>]+>/g,'')
       .replace(/\n{3,}/g,'\n\n').trim()
  ).join('\n\n---\n\n');
}

/* El plan es contenido estático: se construye una vez. Reconstruirlo en cada
   render() cerraba los <details> que el usuario tuviera abiertos. */
let planBuilt=false;
View.plan = function(){
  if(planBuilt) return;
  planBuilt=true;
  let h='<div class="copybar"><button type="button" id="copyPlan">Copiar todo el plan</button>'
    +'<span>Para pegarlo en otro chat</span></div>'
    +'<input id="planFind" type="search" autocomplete="off" '
    +'placeholder="Buscar en el plan…" aria-label="Buscar en el plan">'
    +'<p id="planNone" hidden>Nada coincide.</p>';
  let g=null;
  SECTIONS.forEach(s=>{
    if(s.g && s.g!==g){ g=s.g; h+='<h3 class="grp">'+s.g+'</h3>'; }
    h+='<details class="info"><summary>'+s.t+'</summary>'
      +'<div class="inner">'+s.b+'</div></details>';
  });
  $('planBody').innerHTML=h;

  /* Buscar sirve poco si "natacion" no encuentra "Natación": se comparan ambos
     lados sin tildes. El texto se aplana una vez, no en cada tecla. */
  const norm = t => t.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  const rows  = [...$('planBody').querySelectorAll('details.info')]
                  .map(el=>({el, hay:norm(el.textContent)}));
  const heads = [...$('planBody').querySelectorAll('.grp')];
  $('planFind').oninput = e=>{
    const q = norm(e.target.value.trim());
    let n = 0;
    rows.forEach(r=>{
      const hit = !q || r.hay.includes(q);
      r.el.hidden = !hit;
      r.el.open   = hit && !!q;   // abre lo que coincide; al borrar, todo se cierra
      if(hit) n++;
    });
    /* Un título de grupo sin secciones visibles debajo solo estorba. */
    heads.forEach(hd=>{
      let vis=false;
      for(let x=hd.nextElementSibling; x && !x.classList.contains('grp'); x=x.nextElementSibling)
        if(!x.hidden){ vis=true; break; }
      hd.hidden = !vis;
    });
    $('planNone').hidden = n>0;
  };
  const fallback=(txt,done)=>{
    const ta=document.createElement('textarea');
    ta.value=txt; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); done(); }catch(e){}
    document.body.removeChild(ta);
  };
  $('copyPlan').onclick=()=>{
    const btn=$('copyPlan'), txt=planText();
    const done=()=>{ btn.textContent='Copiado'; setTimeout(()=>btn.textContent='Copiar todo el plan',2000); };
    if(navigator.clipboard) navigator.clipboard.writeText(txt).then(done).catch(()=>fallback(txt,done));
    else fallback(txt,done);
  };
};

/* ============================================================
   5 · ARRANQUE
   ============================================================ */

const TABS = ['hoy','semana','datos','plan'];
let activeTab = 'hoy';

function render(){
  View.header(); View.sessions(); View.english(); View.focus();
  View.habits(); View.week(); View.notes(); View.plan();
  /* Las 6 gráficas sólo se recalculan cuando la pestaña Datos está a la vista. */
  if(activeTab==='datos'){ View.charts(); chartsDirty=false; }
}

function show(t){
  activeTab = t; S.tab = t;
  TABS.forEach(x=>$('tab-'+x).classList.toggle('hide', x!==t));
  document.querySelectorAll('.tabs button').forEach(b=>b.setAttribute('aria-selected', b.dataset.tab===t));
  Store.save();                                    // marca chartsDirty
  if(t==='datos' && chartsDirty){ View.charts(); chartsDirty=false; }
  window.scrollTo(0,0);
}

const tabBtns = [...document.querySelectorAll('.tabs button')];
tabBtns.forEach(b=>b.onclick=()=>show(b.dataset.tab));
document.querySelector('.tabs').onkeydown=e=>{
  const d = e.key==='ArrowRight' ? 1 : e.key==='ArrowLeft' ? -1 : 0;
  if(!d) return;
  e.preventDefault();
  const next = tabBtns[(tabBtns.indexOf(document.activeElement)+d+tabBtns.length)%tabBtns.length];
  next.focus(); show(next.dataset.tab);
};

$('prevW').onclick=()=>{ if(S.week>1){ S.week--; Store.save(); render(); } };
$('nextW').onclick=()=>{ S.week++; Store.save(); render(); };

$('exportBtn').onclick=()=>{
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:'application/json'}));
  a.download='sistema-'+dayISO()+'.json'; a.click(); URL.revokeObjectURL(a.href);
};
$('importBtn').onclick=()=>$('fileIn').click();
if(window.matchMedia('(display-mode: standalone)').matches || navigator.standalone){
  $('installBtn').style.display='none';   // ya está instalada, no ofrecerlo de nuevo
}
$('installBtn').onclick=async()=>{
  if(deferredInstall){
    deferredInstall.prompt();
    await deferredInstall.userChoice;
    deferredInstall=null;
    return;
  }
  const ios = /iPad|iPhone|iPod/.test(navigator.userAgent);
  const local = location.protocol === 'file:';
  $('warnbar').style.display='block';
  $('warnbar').textContent = local
    ? 'Desde el archivo local no se puede instalar. Abre la versión publicada (https) y vuelve a intentar.'
    : ios
      ? 'Toca el ícono de Compartir y luego "Agregar a inicio".'
      : 'Chrome exige medio minuto de uso antes de ofrecer la instalación. Sigue usando la app y vuelve a '
        +'intentar, o entra por ⋮ → "Agregar a pantalla de inicio", que funciona de una.';
};

/* Si el evento llega después de que el usuario tocó el botón, el aviso ya no aplica. */
window.addEventListener('beforeinstallprompt', ()=>{ $('warnbar').style.display='none'; });
$('fileIn').onchange=e=>{
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      S = sanitize(JSON.parse(r.result));
      viewDay = bogota().getUTCDay();
      Store.save(); render(); show(S.tab||'hoy');
      $('status').textContent='Copia restaurada';
    }catch(err){ $('status').textContent='Ese archivo no es una copia válida'; }
  };
  r.readAsText(f);
  e.target.value='';   // permite reimportar el mismo archivo
};
$('menu').querySelectorAll('button').forEach(b=>{
  if(b.id!=='resetBtn') b.addEventListener('click',()=>{ $('menu').open=false; });
});
$('resetBtn').onclick=()=>{
  const b=$('resetBtn');
  if(b.dataset.armed!=='1'){
    b.dataset.armed='1'; b.textContent='Confirmar borrado'; b.classList.add('armed');
    setTimeout(()=>{ b.dataset.armed='0'; b.textContent='Borrar todo'; b.classList.remove('armed'); },4000);
    return;
  }
  S=DEFAULTS();
  viewDay=bogota().getUTCDay();
  b.dataset.armed='0'; b.textContent='Borrar todo'; b.classList.remove('armed');
  Store.save(); render(); show('semana');
};

/* La app es una PWA que se queda abierta en segundo plano durante días, y
   render() solo corría al arrancar o al tocar algo. Sin esto, al volver al día
   siguiente seguías viendo —y marcando— el día anterior. */
let renderedDay = dayISO();
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState!=='visible' || dayISO()===renderedDay) return;
  renderedDay = dayISO();
  viewDay = bogota().getUTCDay();
  render();
});

function boot(){
  $('lock').style.display='none';
  Store.load();
  renderedDay = dayISO();
  render();
  show(S.tab || 'hoy');   // vuelve a la pestaña donde estabas
}

async function tryUnlock(pass, remember){
  const key = await deriveKey(pass, b64d(PLAN_ENC).slice(0,16));
  applyPlan(await decryptPlan(key));
  if(remember){
    try{ localStorage.setItem(KEY_CACHE, b64e(await crypto.subtle.exportKey('raw', key))); }catch(e){}
  }
  boot();
}

$('lockBtn').onclick = async ()=>{
  const b=$('lockBtn');
  b.disabled=true; b.textContent='Abriendo…'; $('lockErr').textContent='';
  try{
    await tryUnlock($('lockPass').value, $('lockRemember').checked);
  }catch(err){
    $('lockErr').textContent='Esa frase no abre el plan.';
    b.disabled=false; b.textContent='Abrir';
    $('lockPass').select();
  }
};
$('lockPass').addEventListener('keydown', e=>{ if(e.key==='Enter') $('lockBtn').click(); });

/* Con la llave recordada entra directo; si está corrupta o cambió la frase, se descarta. */
(async ()=>{
  let cached=null;
  try{ cached = localStorage.getItem(KEY_CACHE); }catch(e){}
  if(cached){
    try{
      const key = await crypto.subtle.importKey('raw', b64d(cached), {name:'AES-GCM'}, true, ['decrypt']);
      applyPlan(await decryptPlan(key));
      boot();
      return;
    }catch(e){ try{ localStorage.removeItem(KEY_CACHE); }catch(_){} }
  }
  $('lockPass').focus();
})();
})();
</script>
