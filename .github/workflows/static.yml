# Publica el contenido estático en GitHub Pages.
name: Deploy static content to Pages

on:
  # Corre en cada push a la rama por defecto
  push:
    branches: ["main"]

  # Permite lanzarlo a mano desde la pestaña Actions
  workflow_dispatch:

# Permisos mínimos para que deploy-pages publique vía OIDC
permissions:
  contents: read
  pages: write
  id-token: write

# Un solo despliegue a la vez. No cancela el que está en curso:
# se deja terminar para no dejar Pages en un estado a medias.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # El repo es público: si alguna vez se edita el plan y se olvida
      # cifrarlo, esto corta el despliegue antes de publicarlo.
      - name: Verificar que el plan no viaje en claro
        run: |
          if grep -rlE 'Carlos, Bogot|Fulbright|testosterona' --include='*.html' --include='*.json' . ; then
            echo "::error::Hay contenido personal sin cifrar. Se aborta el despliegue."
            exit 1
          fi
          grep -q "const PLAN_ENC='.\{100,\}'" index.html \
            || { echo "::error::index.html no trae el plan cifrado (PLAN_ENC vacio)."; exit 1; }
          echo "OK: el plan va cifrado."

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          # Sube el repositorio entero
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
