name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Permisos mínimos para que deploy-pages publique vía OIDC.
permissions:
  contents: read
  pages: write
  id-token: write

# Un despliegue a la vez; no cancela el que ya está corriendo.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Verificar que no se publique nada en claro
        run: |
          if grep -rlE 'Carlos, Bogot|Fulbright|testosterona' --include='*.html' --include='*.json' . ; then
            echo "::error::Hay contenido personal sin cifrar. Se aborta el despliegue."
            exit 1
          fi
          grep -q "const PLAN_ENC='.\{100,\}'" index.html \
            || { echo "::error::index.html no trae el plan cifrado (PLAN_ENC vacio)."; exit 1; }
          echo "OK: el plan va cifrado."

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: '.'

      - id: deployment
        uses: actions/deploy-pages@v5
